# ##################
# PRODUCT QUERIES
# ##################

# List all products with optional sorting and limiting
query ListProducts(
  $orderByName: OrderDirection
  $orderByQuantity: OrderDirection
  $orderByPrice: OrderDirection
  $limit: Int
) @auth(level: PUBLIC) {
  products(
    orderBy: [
      { name: $orderByName }
      { quantity: $orderByQuantity }
      { price: $orderByPrice }
    ]
    limit: $limit
  ) {
    id
    name
    sku
    description
    color
    msrp
    price
    quantity
    manufacturer {
      id
      name
    }
    category {
      id
      name
    }
    images {
      id
      url
      altText
    }
  }
}

# Get product by ID with full details (including specialized type)
query GetProductById($id: UUID!) @auth(level: PUBLIC) {
  product(id: $id) {
    id
    name
    sku
    description
    color
    msrp
    price
    quantity
    manufacturer {
      id
      name
      description
    }
    category {
      id
      name
      description
    }
    images {
      id
      url
      altText
    }
    cpu {
      id
      cores
      threads
      baseClockGHz
      boostClockGHz
      tdp
      socketType
      integratedGraphics
      cacheMB
    }
    gpu {
      id
      chipset
      vramGB
      vramType
      coreCount
      baseClockMHz
      boostClockMHz
      tdp
      lengthMM
      powerConnectors
    }
    storage {
      id
      storageType
      capacityGB
      interface
      formFactor
      readSpeedMBps
      writeSpeedMBps
    }
    psu {
      id
      wattage
      efficiencyRating
      modular
      formFactor
    }
    cpuCooler {
      id
      coolerType
      radiatorSizeMM
      fanSizeMM
      maxTDP
      socketCompatibility
      heightMM
    }
    case {
      id
      formFactor
      moboSupport
      maxGPULengthMM
      maxCPUCoolerHeightMM
      maxPSULengthMM
      driveSlots2_5
      driveSlots3_5
      fanSlots
      radiatorSupport
    }
    ram {
      id
      memoryType
      speedMHz
      capacityGB
      modules
      casLatency
      voltage
    }
    motherboard {
      id
      socketType
      chipset
      formFactor
      memoryType
      memorySlots
      maxMemoryGB
      m2Slots
      sataSlots
      pciSlots
    }
  }
}

# Get product by SKU
query GetProductBySku($sku: String!) @auth(level: PUBLIC) {
  products(where: { sku: { eq: $sku } }) {
    id
    name
    sku
    description
    color
    msrp
    price
    quantity
    manufacturer {
      id
      name
    }
    category {
      id
      name
    }
  }
}

# Search products by name
query SearchProductsByName(
  $nameQuery: String
