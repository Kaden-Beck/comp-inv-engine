# ##################
# MANUFACTURER QUERIES
# ##################

# List all manufacturers
query ListManufacturers(
  $orderByName: OrderDirection
  $limit: Int
) @auth(level: PUBLIC) {
  manufacturers(
    orderBy: [{ name: $orderByName }]
    limit: $limit
  ) {
    id
    name
    description
  }
}

# Get manufacturer by ID with products
query GetManufacturerById($id: UUID!) @auth(level: PUBLIC) {
  manufacturer(id: $id) {
    id
    name
    description
    products(limit: 100) {
      id
      name
      sku
      price
      quantity
    }
  }
}

# Get manufacturer by name
query GetManufacturerByName($name: String!) @auth(level: PUBLIC) {
  manufacturers(where: { name: { eq: $name } }) {
    id
    name
    description
    products(limit: 50) {
      id
      name
      sku
      price
    }
  }
}

# ##################
# CATEGORY QUERIES
# ##################

# List all top-level categories
query ListCategories(
  $orderByName: OrderDirection
  $limit: Int
) @auth(level: PUBLIC) {
  categories(
    where: { parentId: { isNull: true } }
    orderBy: [{ name: $orderByName }]
    limit: $limit
  ) {
    id
    name
    description
    isParent
  }
}

# Get category by ID with parent and children
query GetCategoryById($id: UUID!) @auth(level: PUBLIC) {
  category(id: $id) {
    id
    name
    description
    isParent
    parentId
    parent {
      id
      name
    }
    children(limit: 100) {
      id
      name
      isParent
    }
  }
}

# Get category by name
query GetCategoryByName($name: String!) @auth(level: PUBLIC) {
  categories(where: { name: { eq: $name } }) {
    id
    name
    description
    isParent
    parent {
      id
      name
    }
  }
}

# Get child categories by parent ID
query GetChildCategories($parentId: UUID!) @auth(level: PUBLIC) {
  categories(
    where: { parentId: { eq: $parentId } }
    orderBy: [{ name: ASC }]
  ) {
    id
    name
    description
    isParent
  }
}

# Get parent category
query GetParentCategory($childId: UUID!) @auth(level: PUBLIC) {
  category(id: $childId) {
    id
    name
    parent {
      id
      name
      description
      parent {
        id
        name
      }
    }
  }
}

# Get category hierarchy with all descendants
query GetCategoryHierarchy($id: UUID!) @auth(level: PUBLIC) {
  category(id: $id) {
    id
    name
    description
    isParent
    children {
      id
      name
      description
      children {
        id
        name
      }
    }
  }
}

