# Get low stock products (quantity below threshold)
query GetLowStockProducts(
  $threshold: Int!
  $limit: Int
) @auth(level: PUBLIC) {
  products(
    where: { quantity: { lt: $threshold } }
    orderBy: [{ quantity: ASC }]
    limit: $limit
  ) {
    id
    name
    sku
    quantity
    manufacturer {
      id
      name
    }
    category {
      id
      name
    }
  }
}

