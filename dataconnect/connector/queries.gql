) @auth(level: PUBLIC) {
  products(
    where: { name: { contains: $nameQuery } }
    limit: $limit
  ) {
    id
    name
    sku
    description
    price
    quantity
    manufacturer {
      id
      name
    }
    category {
      id
      name
    }
  }
}

