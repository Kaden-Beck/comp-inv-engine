# ##################
# SPECIALIZED PRODUCT MUTATIONS
# ##################

# Note: Create product first, then create specialized specs with the productId

# Create CPU specs (after creating base Product)
mutation CreateCPUSpecs(
  $productId: UUID!
  $cores: Int!
  $threads: Int!
  $baseClockGHz: Float!
  $boostClockGHz: Float
  $tdp: Int!
  $socketType: String!
  $integratedGraphics: Boolean!
  $cacheMB: Int
) @auth(level: PUBLIC) {
  cpu_insert(data: {
    productId: $productId
    cores: $cores
    threads: $threads
    baseClockGHz: $baseClockGHz
    boostClockGHz: $boostClockGHz
    tdp: $tdp
    socketType: $socketType
    integratedGraphics: $integratedGraphics
    cacheMB: $cacheMB
  }) {
    id
    cores
    threads
    socketType
    product {
      id
      name
      sku
    }
  }
}

