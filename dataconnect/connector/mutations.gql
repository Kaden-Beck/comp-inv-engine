# ##################
# PRODUCT MUTATIONS
# ##################

mutation CreateProduct(
  $name: String!
  $sku: String!
  $description: String!
  $color: String
  $msrp: Float!
  $price: Float
  $quantity: Int!
  $manufacturerId: UUID!
  $categoryId: UUID!
) @auth(level: PUBLIC) {
  product_insert(
    data: {
      name: $name
      sku: $sku
      description: $description
      color: $color
      msrp: $msrp
      price: $price
      quantity: $quantity
      manufacturerId: $manufacturerId
      categoryId: $categoryId
    }
  )
}

mutation UpdateProduct(
  $id: UUID!
  $name: String
  $description: String
  $color: String
  $price: Float
  $quantity: Int
  $categoryId: UUID
) @auth(level: PUBLIC) {
  product_update(
    id: $id
    data: {
      name: $name
      description: $description
      color: $color
      price: $price
      quantity: $quantity
      categoryId: $categoryId
    }
  )
}

mutation DeleteProduct($id: UUID!) @auth(level: PUBLIC) {
  product_delete(id: $id)
}

# ##################
# SPECIALIZED PRODUCT MUTATIONS
# ##################

mutation CreateCPUSpecs(
  $productId: UUID!
  $cores: Int!
  $threads: Int!
  $baseClockGHz: Float!
  $boostClockGHz: Float
  $tdp: Int!
  $socketType: String!
  $integratedGraphics: Boolean!
  $cacheMB: Int
) @auth(level: PUBLIC) {
  cpu_insert(
    data: {
      productId: $productId
      cores: $cores
      threads: $threads
      baseClockGHz: $baseClockGHz
      boostClockGHz: $boostClockGHz
      tdp: $tdp
      socketType: $socketType
      integratedGraphics: $integratedGraphics
      cacheMB: $cacheMB
    }
  )
}

mutation CreateGPUSpecs(
