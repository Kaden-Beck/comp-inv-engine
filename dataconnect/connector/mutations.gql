# ##################
# PRODUCT MUTATIONS
# ##################

# Create a new product
mutation CreateProduct(
  $name: String!
  $sku: String!
  $description: String!
  $color: String
  $msrp: Float!
  $price: Float
  $quantity: Int!
  $manufacturerId: UUID!
  $categoryId: UUID!
) @auth(level: PUBLIC) {
  product_insert(data: {
    name: $name
    sku: $sku
    description: $description
    color: $color
    msrp: $msrp
    price: $price
    quantity: $quantity
    manufacturerId: $manufacturerId
    categoryId: $categoryId
  }) {
    id
    name
    sku
    quantity
    manufacturer {
      id
      name
    }
    category {
      id
      name
    }
  }
}

# Update product
mutation UpdateProduct(
  $id: UUID!
  $name: String
  $description: String
  $color: String
  $price: Float
  $quantity: Int
  $categoryId: UUID
) @auth(level: PUBLIC) {
  product_update(
    id: $id
    data: {
      name: $name
      description: $description
      color: $color
      price: $price
      quantity: $quantity
      categoryId: $categoryId
    }
  ) {
    id
    name
    sku
    price
    quantity
    manufacturer {
      id
      name
    }
    category {
      id
      name
    }
  }
}

# Delete product
mutation DeleteProduct($id: UUID!) @auth(level: PUBLIC) {
  product_delete(id: $id) {
    id
  }
}

# Update product quantity (for inventory operations)
mutation UpdateProductQuantity(
  $id: UUID!
  $quantity: Int!
) @auth(level: PUBLIC) {
  product_update(
    id: $id
    data: { quantity: $quantity }
  ) {
    id
    name
    sku
    quantity
  }
}

